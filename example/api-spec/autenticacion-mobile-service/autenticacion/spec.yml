method: POST
auth: none
behavior:
  rate_limit:
    by: "{{body.usuario}}"
    window: on-success
    max: 3
    on_limit: { status: 423, body: { error: "Cuenta temporalmente bloqueada" } }
cases:
  s200:
    match: { "body.usuario": "jperez", "body.contrasena": "test1234", "body.totp": null }
    request: request.json
    response: response-200.json
    status: 200
  s200_v2:
    match: { "body.usuario": "jperez", "body.contrasena": "test1234", "body.totp": "123456" }
    request: request-v2.json
    response: response-200-v2.json
    status: 200
  s401:
    response: response-401.json
    status: 401
dynamic:
  "timestamp": "{{now}}"
  "data.aplicaciones.0.token": "Bearer mock.{{uuid}}"
